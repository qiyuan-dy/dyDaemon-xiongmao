name: Build dyDaemon DEB

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          if [ ! -d "$HOME/theos" ]; then
            git clone --recursive https://github.com/theos/theos.git $HOME/theos --depth 1
          fi
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install ldid
        run: |
          brew install ldid 2>/dev/null || echo "ldid install skipped (may already exist)"

      - name: Check SDK
        run: |
          echo "=== Xcode 版本 ==="
          xcodebuild -version
          echo "=== 可用 SDK ==="
          ls $HOME/theos/sdks/ 2>/dev/null || echo "需要下载 SDK"
          # 链接 Xcode SDK
          mkdir -p $HOME/theos/sdks
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "SDK Path: $SDK_PATH"
          echo "SDK Version: $SDK_VERSION"
          ln -sf "$SDK_PATH" "$HOME/theos/sdks/iPhoneOS${SDK_VERSION}.sdk"
          echo "SDK 链接: iPhoneOS${SDK_VERSION}.sdk → $SDK_PATH"
          ls -la $HOME/theos/sdks/
          # 更新 Makefile 中的 SDK 版本
          sed -i '' "s/TARGET = iphone:clang:15.0:12.0/TARGET = iphone:clang:${SDK_VERSION}:12.0/" Makefile
          echo "Makefile TARGET 已更新"

      - name: Build
        run: |
          cd $GITHUB_WORKSPACE
          echo "=== 开始编译 ==="
          make clean
          make package FINALPACKAGE=1
          echo "=== 编译完成 ==="

      - name: List output
        run: |
          echo "=== 生成的文件 ==="
          find . -name "*.deb" -type f 2>/dev/null
          ls -la packages/*.deb 2>/dev/null || echo "未找到 deb 文件"
          ls -la packages/ 2>/dev/null || true

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: dyDaemon-xiongmao-deb
          path: "packages/*.deb"
          if-no-files-found: warn

      - name: Upload packages dir
        uses: actions/upload-artifact@v4
        with:
          name: dyDaemon-packages
          path: "packages/"
          if-no-files-found: warn
